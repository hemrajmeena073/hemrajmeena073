name: Update GitHub Profile Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Checkout Repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # Create Profile Directory
      # ==========================================
      - name: Create profile directory
        run: |
          mkdir -p profile

      # ==========================================
      # Generate GitHub Stats
      # ==========================================
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=hemrajmeena073&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GH_TOKEN }}

      # ==========================================
      # Generate Top Languages
      # ==========================================
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=hemrajmeena073&layout=compact&langs_count=8&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GH_TOKEN }}

      # ==========================================
      # Generate GitHub Streak
      # ==========================================
      - name: Generate GitHub Streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=hemrajmeena073&theme=tokyonight&hide_border=true&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GH_TOKEN }}

      # ==========================================
      # Verify Generated Files
      # ==========================================
      - name: Verify generated files
        run: |
          echo "=========================================="
          echo "Generated profile files:"
          echo "=========================================="

          ls -lah profile/

          echo ""
          echo "Checking files..."

          test -f profile/stats.svg
          test -f profile/top-langs.svg
          test -f profile/streak.svg

          echo ""
          echo "✓ stats.svg exists"
          echo "✓ top-langs.svg exists"
          echo "✓ streak.svg exists"

      # ==========================================
      # Commit Generated Cards
      # ==========================================
      - name: Commit generated cards
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Adding generated SVG files..."

          git add profile/stats.svg
          git add profile/top-langs.svg
          git add profile/streak.svg

          echo ""
          echo "Git status:"
          git status

          echo ""
          echo "Committing changes..."

          git diff --cached --quiet || git commit -m "Update GitHub profile stats"

          echo ""
          echo "Pushing changes..."

          git push origin HEAD:main
